---
- name: Test Percona PostgreSQL installation
  hosts: percona_cluster
  become: true
  gather_facts: true
  strategy: linear
  any_errors_fatal: true

  vars:
    percona_version: 16
    percona_packages_profile: cluster

  roles:
    - percona_repository
    - percona_packages
    - percona_etcd
    - percona_patroni
