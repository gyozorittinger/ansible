---
- name: Test Percona PostgreSQL installation
  hosts: percona_cluster
  become: true
  gather_facts: true
  strategy: linear
  any_errors_fatal: true

  vars_files:
    - ../vars/percona_test_vars.yml

  roles:
    - percona_baseline
    - percona_repository
    - percona_packages
    - percona_etcd
    - percona_patroni
    - percona_haproxy
    - percona_keepalived
