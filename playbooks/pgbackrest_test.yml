---
- name: Test Percona pgBackRest installation
  hosts: percona_backup
  become: true
  gather_facts: true
  strategy: linear
  any_errors_fatal: true

  vars_files:
    - ../vars/percona_test_vars.yml
    - ../vars/pgbackrest_test_vars.yml

  roles:
    - percona_baseline
    - percona_repository
    - percona_packages
    - percona_pgbackrest_server
