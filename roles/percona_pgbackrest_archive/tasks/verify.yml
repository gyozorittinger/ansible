---
- name: Read effective PostgreSQL archive configuration
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - "/usr/pgsql-{{ percona_version }}/bin/psql"
      - -X
      - -p
      - "{{ percona_postgresql_port | default(5432) | string }}"
      - -At
      - -c
      - >-
        SELECT json_build_object(
          'archive_mode', current_setting('archive_mode'),
          'archive_command', current_setting('archive_command'),
          'restore_command', current_setting('restore_command'),
          'archive_timeout', current_setting('archive_timeout'),
          'archive_timeout_seconds',
          (SELECT setting::integer FROM pg_settings
           WHERE name = 'archive_timeout')
        );
  register: pgbackrest_archive_effective_config
  changed_when: false

- name: Validate effective PostgreSQL archive configuration
  ansible.builtin.assert:
    that:
      - effective_config.archive_mode == percona_pgbackrest_archive_mode
      - effective_config.archive_command == percona_pgbackrest_archive_command
      - effective_config.restore_command == percona_pgbackrest_restore_command
      - effective_config.archive_timeout_seconds | int == expected_timeout_seconds | int
    fail_msg: >-
      PostgreSQL archive configuration is incorrect
      on {{ inventory_hostname }}.
    success_msg: >-
      PostgreSQL archive configuration is correct
      on {{ inventory_hostname }}.
  vars:
    effective_config: "{{ pgbackrest_archive_effective_config.stdout | from_json }}"
    expected_timeout_seconds: "{{ percona_pgbackrest_archive_timeout | regex_replace('s$', '') }}"

- name: Display effective PostgreSQL archive configuration
  ansible.builtin.debug:
    msg: "{{ pgbackrest_archive_effective_config.stdout | from_json }}"

- name: Verify pgBackRest backup repository connectivity
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - "{{ percona_pgbackrest_binary }}"
      - "--stanza={{ percona_pgbackrest_stanza }}"
      - "--log-level-console=info"
      - check
  delegate_to: "{{ groups[percona_pgbackrest_backup_group][0] }}"
  run_once: true
  register: pgbackrest_archive_check
  changed_when: false

- name: Display pgBackRest check result
  ansible.builtin.debug:
    var: pgbackrest_archive_check.stdout_lines
  run_once: true
