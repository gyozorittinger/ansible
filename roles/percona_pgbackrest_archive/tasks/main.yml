---
- name: Configure Patroni WAL archiving
  ansible.builtin.import_tasks: configure.yml
  run_once: true

- name: Verify archive configuration propagation
  ansible.builtin.import_tasks: propagate.yml

- name: Perform rolling PostgreSQL restart
  ansible.builtin.import_tasks: restart.yml
  run_once: true

- name: Perform leader switchover if required
  ansible.builtin.import_tasks: switchover.yml
  run_once: true

- name: Verify PostgreSQL WAL archiving
  ansible.builtin.import_tasks: verify.yml
