---
- name: Install Python cryptography dependency
  ansible.builtin.dnf:
    name: python3-cryptography
    state: present
    install_weak_deps: false

- name: Prepare pgBackRest certificate authority
  ansible.builtin.import_tasks: ca.yml
  delegate_to: localhost
  run_once: true

- name: Prepare pgBackRest node certificates
  ansible.builtin.import_tasks: certificates.yml
