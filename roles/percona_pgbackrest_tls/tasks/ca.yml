---
- name: Create pgBackRest CA directory
  ansible.builtin.file:
    path: "{{ percona_pgbackrest_tls_ca_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate pgBackRest CA private key
  community.crypto.openssl_privatekey:
    path: "{{ percona_pgbackrest_tls_ca_dir }}/ca.key"
    size: "{{ percona_pgbackrest_tls_key_size }}"
    type: RSA
    mode: '0600'
    regenerate: never

- name: Generate pgBackRest CA certificate signing request
  community.crypto.openssl_csr:
    path: "{{ percona_pgbackrest_tls_ca_dir }}/ca.csr"
    privatekey_path: "{{ percona_pgbackrest_tls_ca_dir }}/ca.key"
    common_name: "{{ percona_pgbackrest_tls_ca_common_name }}"
    digest: "{{ percona_pgbackrest_tls_digest }}"
    use_common_name_for_san: false
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
    mode: '0600'

- name: Generate pgBackRest CA certificate
  community.crypto.x509_certificate:
    path: "{{ percona_pgbackrest_tls_ca_dir }}/ca.crt"
    privatekey_path: "{{ percona_pgbackrest_tls_ca_dir }}/ca.key"
    csr_path: "{{ percona_pgbackrest_tls_ca_dir }}/ca.csr"
    provider: selfsigned
    selfsigned_digest: "{{ percona_pgbackrest_tls_digest }}"
    selfsigned_not_after: "{{ percona_pgbackrest_tls_ca_validity }}"
    ignore_timestamps: true
    mode: '0644'
