---
- name: Create local credentials directory
  ansible.builtin.file:
    path: "{{ percona_credentials_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: Generate or retrieve PostgreSQL credentials
  ansible.builtin.set_fact:
    percona_postgresql_superuser_password: >-
      {{ lookup('ansible.builtin.password',
                percona_credentials_dir ~ '/superuser',
                length=percona_password_length,
                chars=percona_password_chars) }}

    percona_postgresql_replication_password: >-
      {{ lookup('ansible.builtin.password',
                percona_credentials_dir ~ '/replication',
                length=percona_password_length,
                chars=percona_password_chars) }}

    percona_postgresql_rewind_password: >-
      {{ lookup('ansible.builtin.password',
                percona_credentials_dir ~ '/rewind',
                length=percona_password_length,
                chars=percona_password_chars) }}
  run_once: true
  no_log: true

- name: Secure generated credential files
  ansible.builtin.file:
    path: "{{ percona_credentials_dir }}/{{ item }}"
    state: file
    mode: "0600"
  loop:
    - superuser
    - replication
    - rewind
  delegate_to: localhost
  run_once: true

- name: Save PostgreSQL credentials summary
  ansible.builtin.copy:
    dest: "{{ percona_credentials_dir }}/credentials.yml"
    mode: "0600"
    content: |
      cluster: {{ percona_patroni_scope }}

      superuser:
        username: {{ percona_postgresql_superuser }}
        password: {{ percona_postgresql_superuser_password }}

      replication:
        username: {{ percona_postgresql_replication_user }}
        password: {{ percona_postgresql_replication_password }}

      rewind:
        username: {{ percona_postgresql_rewind_user }}
        password: {{ percona_postgresql_rewind_password }}
  delegate_to: localhost
  run_once: true
  no_log: true
  diff: false
