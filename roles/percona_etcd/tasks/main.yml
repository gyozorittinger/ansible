---
- name: Validate etcd cluster configuration
  ansible.builtin.assert:
    that:
      - groups[percona_etcd_group] | length == 3
      - inventory_hostname in groups[percona_etcd_group]
      - percona_node_ip is defined
      - ansible_play_batch | sort == groups[percona_etcd_group] | sort
    fail_msg: "All three etcd nodes must be configured together"

- name: Ensure etcd data directory exists
  ansible.builtin.file:
    path: "{{ percona_etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0750"

- name: Deploy etcd configuration
  ansible.builtin.template:
    src: etcd.conf.yaml.j2
    dest: "{{ percona_etcd_config_file }}"
    owner: root
    group: etcd
    mode: "0640"
    backup: true

- name: Enable and start etcd service
  ansible.builtin.systemd_service:
    name: etcd
    enabled: true
    state: started
    no_block: true

- name: Wait for local etcd endpoint
  ansible.builtin.command:
    argv:
      - etcdctl
      - "--endpoints=http://127.0.0.1:{{ percona_etcd_client_port }}"
      - endpoint
      - health
  environment:
    ETCDCTL_API: "3"
  register: etcd_health
  changed_when: false
  until: etcd_health.rc == 0
  retries: 30
  delay: 5

- name: Verify entire etcd cluster
  ansible.builtin.command:
    argv:
      - etcdctl
      - "--endpoints=http://127.0.0.1:{{ percona_etcd_client_port }}"
      - endpoint
      - health
      - --cluster
  environment:
    ETCDCTL_API: "3"
  register: etcd_cluster_health
  changed_when: false
  until: etcd_cluster_health.rc == 0
  retries: 10
  delay: 5
  run_once: true

- name: Display etcd cluster health
  ansible.builtin.debug:
    var: etcd_cluster_health.stdout_lines
  run_once: true
