---
- name: Validate pgBackRest backup group
  ansible.builtin.assert:
    that:
      - percona_pgbackrest_backup_group in groups
      - groups[percona_pgbackrest_backup_group] | length == 1
    fail_msg: "Exactly one pgBackRest backup server is required."

- name: Create pgBackRest log directory
  ansible.builtin.file:
    path: "{{ percona_pgbackrest_log_path }}"
    state: directory
    owner: "{{ percona_pgbackrest_user }}"
    group: "{{ percona_pgbackrest_group }}"
    mode: '0750'

- name: Create pgBackRest configuration directory
  ansible.builtin.file:
    path: "{{ percona_pgbackrest_config_file | dirname }}"
    state: directory
    owner: root
    group: "{{ percona_pgbackrest_group }}"
    mode: '0750'

- name: Deploy pgBackRest client configuration
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: "{{ percona_pgbackrest_config_file }}"
    owner: root
    group: "{{ percona_pgbackrest_group }}"
    mode: '0640'
    backup: true
  notify: Restart pgBackRest client

- name: Enable and start pgBackRest client service
  ansible.builtin.systemd_service:
    name: pgbackrest
    enabled: true
    state: started

- name: Apply pending pgBackRest configuration changes
  ansible.builtin.meta: flush_handlers

- name: Wait for local pgBackRest TLS listener
  ansible.builtin.wait_for:
    host: "{{ percona_pgbackrest_tls_address }}"
    port: "{{ percona_pgbackrest_tls_port }}"
    timeout: 30

- name: Verify backup server TLS port connectivity
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups[percona_pgbackrest_backup_group][0]].percona_node_ip }}"
    port: "{{ percona_pgbackrest_tls_port }}"
    timeout: 30

- name: Display pgBackRest client configuration summary
  ansible.builtin.debug:
    msg:
      - "Node: {{ inventory_hostname }}"
      - "Stanza: {{ percona_pgbackrest_stanza }}"
      - "PostgreSQL data: {{ percona_postgresql_data_dir }}"
      - "Backup server: {{ groups[percona_pgbackrest_backup_group][0] }}"
      - "Repository: {{ percona_pgbackrest_repo_path }}"
      - "TLS endpoint: {{ percona_pgbackrest_tls_address }}:{{ percona_pgbackrest_tls_port }}"
